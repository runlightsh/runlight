[workspace]
resolver = "3"
members = ["runlight", "runlight-sqlx"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Jon C. Phillips"]
repository = "https://github.com/runlightsh/runlight"
homepage = "https://runlight.sh"
keywords = ["analytics", "privacy", "web-analytics", "short-links"]
categories = ["web-programming", "asynchronous"]

# runlight-sqlx requires runlight at exactly the release's version, so a
# release's crates always come together.
[workspace.dependencies]
runlight = { path = "runlight", version = "=0.2.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

# A password hash costs 32 MiB and a good while, and the tests sign in often, so what it is made of is built
# optimized even for tests.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3

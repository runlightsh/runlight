# A release tag -> the three .NET packages in packages/dotnet (Runlight,
# Runlight.AspNetCore, and the runlight tool Runlight.Server) packed and
# published to nuget.org, with nuget.org's trusted publishing: nuget.org
# trusts this workflow's OIDC token and hands back an API key that lives one
# hour, so no API key is stored anywhere. Can also be started by hand on a
# tag.
#
# Three jobs. "ci" waits for CI to pass on the tagged commit (ci-passed.yml).
# "pack" holds no secret and no environment, and uploads the packages as the
# run's artifact "nuget-packages"; "publish" waits in the environment
# "nuget" for its reviewer, who opens the artifact, looks, and approves. A
# version pushed to nuget.org cannot be deleted or replaced, only unlisted
# or deprecated.
#
# Stays off until the repository variable NUGET_ENABLED is "true". Before
# that, on nuget.org (the account menu, Trusted Publishing): add a policy
# with repository owner runlightsh, repository runlight, workflow file
# nuget.yml (the file name only), and environment nuget, whose scope allows
# pushing new packages and new versions of packages matching Runlight and
# Runlight.*; and here, create the environment "nuget" (Settings,
# Environments) with required reviewers, and give it the environment variable
# NUGET_USER: the nuget.org profile name (never the email address) of the
# account that created the policy. Then set the repository variable
# NUGET_ENABLED to true.
name: NuGet

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One queue per tag, so a pending run for one tag never displaces another's.
concurrency:
  group: nuget-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  # CI must pass on the tagged commit first (ci-passed.yml).
  ci:
    if: vars.NUGET_ENABLED == 'true'
    uses: ./.github/workflows/ci-passed.yml
    permissions:
      actions: read
      contents: read
    with:
      workflows: ci.yml dotnet.yml

  pack:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci.outputs.sha }}
          persist-credentials: false
      - name: Check the tag is the solution's version
        working-directory: packages/dotnet
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "not a release tag: $TAG"; exit 1 ;; esac
          # The packages' version must be the tag's, or nuget.org would list
          # a release the tag does not name.
          version="$(sed -n 's/^ *<Version>\(.*\)<\/Version>$/\1/p' Directory.Build.props)"
          if [ "v$version" != "$TAG" ]; then echo "packages/dotnet is $version, the tag is $TAG"; exit 1; fi
      # The SDK dotnet.yml builds and packs with; global.json pins its floor.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      # The solution: only the three projects under src are packable.
      - name: dotnet pack
        working-directory: packages/dotnet
        run: dotnet pack -c Release -o artifacts/packages
      # Exactly the three packages, at the tag's version, and nothing from
      # the tests.
      - name: The packages
        working-directory: packages/dotnet
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          ls -l artifacts/packages
          expected="$(printf '%s\n' Runlight Runlight.AspNetCore Runlight.Server | sed "s/\$/.$version.nupkg/" | sort)"
          found="$(cd artifacts/packages && find . -maxdepth 1 -name '*.nupkg' | sed 's#^\./##' | sort)"
          if [ "$found" != "$expected" ]; then printf 'expected:\n%s\nfound:\n%s\n' "$expected" "$found"; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages
          path: packages/dotnet/artifacts/packages/*.nupkg
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    # Nothing is checked out here: the job pushes what "pack" built and the
    # reviewer saw, and nothing else.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-packages
          path: packages
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      # The job's OIDC token for an API key that lives one hour, so this is
      # the last step before the push. NUGET_USER is the environment's
      # variable.
      - name: Get a nuget.org key for this job
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      # NuGet has no atomic publish of several packages: each is pushed on
      # its own and listed once nuget.org has validated it. The core goes
      # first, then Runlight.AspNetCore, then the tool that needs both, so no
      # package is listed before one it needs. --skip-duplicate makes a run
      # started again after a partial failure push only what is missing.
      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "not a release tag: $TAG"; exit 1 ;; esac
          version="${TAG#v}"
          ls -l packages
          for p in Runlight Runlight.AspNetCore Runlight.Server; do
            dotnet nuget push "packages/$p.$version.nupkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done

# The .NET package (packages/dotnet): format, build, and the tests against
# SQLite, Postgres, and MySQL or MariaDB, then the suite again under a culture
# that writes 1,5 and folds I to a dotless i, and the packages as nuget.org
# would take them. The assets and generated tables must match the SDK.
name: .NET

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mysql: mirror.gcr.io/library/mysql:8.4
            mysql-health: mysqladmin ping -h 127.0.0.1 -ppw
          - mysql: mirror.gcr.io/library/mariadb:11.4
            mysql-health: healthcheck.sh --connect --innodb_initialized
          - mysql: mirror.gcr.io/library/mysql:8.0
            mysql-health: mysqladmin ping -h 127.0.0.1 -ppw
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: runlight
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: ${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: pw
          MARIADB_ROOT_PASSWORD: pw
          MYSQL_DATABASE: runlight
        ports: ["3306:3306"]
        options: >-
          --health-cmd "${{ matrix.mysql-health }}" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      RUNLIGHT_TEST_PG: postgres://postgres:pw@127.0.0.1:5432/runlight
      RUNLIGHT_TEST_MYSQL: mysql://root:pw@127.0.0.1:3306/runlight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Assets current
        run: |
          node --import tsx scripts/dotnet-assets.mts --check
          node scripts/dotnet-intl.mjs --check
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('packages/dotnet/Directory.Packages.props', 'packages/dotnet/**/*.csproj') }}
          restore-keys: nuget-
      - name: dotnet format --verify-no-changes
        working-directory: packages/dotnet
        run: dotnet format --verify-no-changes
      - name: dotnet build
        working-directory: packages/dotnet
        run: dotnet build -c Release
      - name: dotnet test
        working-directory: packages/dotnet
        run: dotnet test -c Release --no-build
      - name: dotnet test, tr-TR
        working-directory: packages/dotnet
        env:
          RUNLIGHT_CULTURE: tr-TR
        run: dotnet test -c Release --no-build
      - name: dotnet pack
        working-directory: packages/dotnet
        run: dotnet pack -c Release --no-build -o artifacts/packages

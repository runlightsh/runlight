# The Rust package (packages/rust): the runlight crate and runlight-sqlx, on
# the core's rust-version (1.88), on 1.94 (runlight-sqlx, whose sqlx 0.9 needs
# it), and on the current stable, against SQLite, Postgres, MySQL 8.4 (8.0 on
# 1.88), and MariaDB 11.4. The conformance runner replays conformance/http.json on every
# one of them. rustfmt and clippy run on stable.
name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: rust (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.88", "1.94", "stable"]
        include:
          - rust: "1.88"
            mysql: mirror.gcr.io/library/mysql:8.0
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: runlight
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: ${{ matrix.mysql || 'mirror.gcr.io/library/mysql:8.4' }}
        env:
          MYSQL_ROOT_PASSWORD: pw
          MYSQL_DATABASE: runlight
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppw" --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mirror.gcr.io/library/mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: pw
          MARIADB_DATABASE: runlight
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      RUNLIGHT_TEST_PG: postgres://postgres:pw@127.0.0.1:5432/runlight
      RUNLIGHT_TEST_MYSQL: mysql://root:pw@127.0.0.1:3306/runlight
      RUNLIGHT_TEST_MARIADB: mysql://root:pw@127.0.0.1:3307/runlight
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Ubuntu 26.04 moved the time zone database's old names (Asia/Calcutta, US/Eastern) into
      # tzdata-legacy, and the zone tests read every name the SDK accepts from the system's database.
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends tzdata-legacy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
        working-directory: .
      # The dashboard and tracker the crate serves are the SDK's, copied; this fails when the copy is stale.
      - run: node --import tsx scripts/rust-assets.mts --check
        working-directory: .
      # The Intl data email reports format with, made from Node's ICU by a script. It is compared only when this
      # Node's ICU is the one that wrote it, as python.yml's python-intl check is.
      - name: The Intl data is current
        run: node --import tsx scripts/rust-intl.mts --check
        working-directory: .
      # rustup is on the runner, so no third-party action is needed.
      - name: Install Rust ${{ matrix.rust }}
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy
          rustup default ${{ matrix.rust }}
      - name: cargo fmt
        if: matrix.rust == 'stable'
        run: cargo fmt --check
      - name: cargo clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The workspace's .cargo/config.toml sets TZ=UTC, as the fixtures are made.
      - name: cargo test
        run: |
          if [ "${{ matrix.rust }}" = "1.88" ]; then
            cargo test -p runlight --all-features
          else
            cargo test --workspace --all-features
          fi

# Every push and pull request: the dash check (files and commit messages),
# typecheck, the tests against SQLite, Postgres, and MySQL or MariaDB, and a
# build, on the two Node majors better-sqlite3 13 supports. The PHP package's
# tests run in a job of their own, on PHP 8.2 and 8.4, and the WordPress and
# Drupal plugins are parsed on the oldest PHP each says it runs on. On the
# Node 24 leg, `npm run check` also runs every fixture generator with --check
# (scripts/check-fixtures.mjs), so a fixture the ports replay cannot fall
# behind the TypeScript that writes it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No em or en dashes in commit messages
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            node scripts/check-dashes.mjs --commits "$BASE..$HEAD"
          elif [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # A new branch (before is all zeros) or a force push: the head commit only.
            node scripts/check-dashes.mjs --commits -1 "$AFTER"
          else
            node scripts/check-dashes.mjs --commits "$BEFORE..$AFTER"
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each Node major also runs against one of MySQL and MariaDB, and Node 24 once more against
        # MySQL 8.0, the oldest line Runlight supports (8.0.20 and later).
        include:
          - node: 22
            mysql: mirror.gcr.io/library/mysql:8.4
            mysql-health: mysqladmin ping -h 127.0.0.1 -ppw
          - node: 24
            mysql: mirror.gcr.io/library/mariadb:11.4
            mysql-health: healthcheck.sh --connect --innodb_initialized
          - node: 24
            mysql: mirror.gcr.io/library/mysql:8.0
            mysql-health: mysqladmin ping -h 127.0.0.1 -ppw
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: runlight
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: ${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: pw
          MARIADB_ROOT_PASSWORD: pw
          MYSQL_DATABASE: runlight
        ports: ["3306:3306"]
        options: >-
          --health-cmd "${{ matrix.mysql-health }}" --health-interval 5s --health-timeout 5s --health-retries 20
      # The oldest line the ClickHouse store supports.
      clickhouse:
        image: mirror.gcr.io/clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_PASSWORD: pw
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123"]
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client --password pw -q 'SELECT 1'" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      RUNLIGHT_TEST_PG: postgres://postgres:pw@127.0.0.1:5432/runlight
      RUNLIGHT_TEST_MYSQL: mysql://root:pw@127.0.0.1:3306/runlight
      RUNLIGHT_TEST_CLICKHOUSE: http://default:pw@127.0.0.1:8123
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The SDK's tests run the CMS plugins' PHP (packages/sdk/test/plugins.test.ts),
      # and fail rather than skip in CI when PHP is missing.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          coverage: none
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build

  # The PHP package (packages/php), on the oldest PHP it supports and a current one, against the same three
  # kinds of database. Each PHP version also runs against one of MySQL and MariaDB, and PHP 8.2 once more against
  # MySQL 8.0, the oldest line Runlight supports (8.0.20 and later).
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2"
            mysql: mirror.gcr.io/library/mysql:8.4
            mysql-health: mysqladmin ping -h 127.0.0.1 -ppw
          - php: "8.4"
            mysql: mirror.gcr.io/library/mariadb:11.4
            mysql-health: healthcheck.sh --connect --innodb_initialized
          - php: "8.2"
            mysql: mirror.gcr.io/library/mysql:8.0
            mysql-health: mysqladmin ping -h 127.0.0.1 -ppw
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: runlight
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: ${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: pw
          MARIADB_ROOT_PASSWORD: pw
          MYSQL_DATABASE: runlight
        ports: ["3306:3306"]
        options: >-
          --health-cmd "${{ matrix.mysql-health }}" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      RUNLIGHT_TEST_PG: postgres://postgres:pw@127.0.0.1:5432/runlight
      RUNLIGHT_TEST_MYSQL: mysql://root:pw@127.0.0.1:3306/runlight
    defaults:
      run:
        working-directory: packages/php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The cross-implementation and migration tests run the TypeScript store, which needs the repo's packages.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
        working-directory: .
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, intl, mbstring, openssl, pdo_mysql, pdo_pgsql, pdo_sqlite, sodium, timezonedb, zlib
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit

  # The plugins' own PHP runs above on PHP 8.4 alone, so each is also parsed
  # (php -l) on the oldest PHP it says it runs on: WordPress on 8.1 (Requires
  # PHP in its header and readme), Drupal on 8.2 (its composer.json). Syntax
  # from a later PHP is a parse error there, on every page of the site. The
  # Craft plugin is loaded on its floor in the job below.
  plugins-floor:
    name: plugins-floor (${{ matrix.dir }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: plugins/wordpress
            php: "8.1"
          - dir: plugins/drupal
            php: "8.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: php -l over every PHP file
        env:
          DIR: ${{ matrix.dir }}
          PHP: ${{ matrix.php }}
        run: |
          case "$(php -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')" in
            "$PHP") ;;
            *) echo "this is PHP $(php -r 'echo PHP_VERSION;'), not $PHP"; exit 1 ;;
          esac
          count=0
          failed=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! out="$(php -l "$file" 2>&1)"; then
              echo "$out"
              failed=1
            fi
          done < <(find "$DIR" -type f \( -name '*.php' -o -name '*.module' -o -name '*.install' -o -name '*.inc' -o -name '*.theme' \) -not -path '*/vendor/*' -print0)
          if [ "$count" -eq 0 ]; then echo "no PHP files under $DIR"; exit 1; fi
          echo "$count files parsed on PHP $PHP"
          exit "$failed"

  # The Craft plugin has no database to run against here, so each of its
  # classes is loaded against a real Craft install, on the oldest PHP and the
  # newest Craft it allows, which catches what php -l cannot.
  craft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.2"
          extensions: curl, intl, mbstring, openssl, pdo_mysql, zip
          coverage: none
          tools: composer:v2
      - run: composer validate --strict --no-plugins
        working-directory: plugins/craft
      # The plugin needs this commit's PHP package, which a release commit
      # requires before Packagist has it, so it comes from packages/php.
      - run: |
          composer config repositories.runlight "$(jq -nc --arg v "$(jq -r .version ../../packages/sdk/package.json)" '{type: "path", url: "../../packages/php", options: {symlink: false, versions: {"runlight/runlight": $v}}}')"
        working-directory: plugins/craft
      # Every Craft 5 release pins a dependency with a security advisory at
      # times (Twig, 2026-11-24), which Composer then refuses to install. This
      # job only loads the plugin's classes against Craft and ships nothing,
      # so it installs Craft anyway.
      - run: composer config audit.block-insecure false
        working-directory: plugins/craft
      - run: composer update --no-interaction --no-progress --prefer-dist --no-plugins
        working-directory: plugins/craft
      - run: php scripts/craft-load.php

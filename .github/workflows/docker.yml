# A release tag -> the standalone server's Docker image, built from the
# Dockerfile for linux/amd64 and linux/arm64 and pushed to
# ghcr.io/runlightsh/runlight, tagged with the version (0.1.0) and, for the
# highest stable release, latest. A prerelease (0.2.0-beta.1) is never latest,
# and neither is a rerun for an older tag. The amd64 image is started and
# must answer /healthz before anything is pushed. Pushing the same tags again
# replaces them, so a rerun is safe. Can also be started by hand on a tag.
#
# Stays off until the repository variable DOCKER_ENABLED is "true". It needs
# no secret: the workflow's own token may write this repository's packages.
# The first push makes the package private; make it public once, under the
# package's settings on GitHub, so `docker pull` needs no login. To make
# each push wait for a reviewer and run only from a tag, create an
# environment "docker" (Settings, Environments) that allows only the tags v*,
# then add `environment: docker` to the image job.
name: Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One queue per tag, so a pending run for one tag never displaces another's.
concurrency:
  group: docker-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # CI must pass on the tagged commit first (ci-passed.yml).
  ci:
    if: vars.DOCKER_ENABLED == 'true'
    uses: ./.github/workflows/ci-passed.yml
    permissions:
      actions: read
      contents: read

  image:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci.outputs.sha }}
          persist-credentials: false
      - name: Check the tag against the server's version
        id: version
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "not a release tag: $TAG"; exit 1 ;; esac
          version="${TAG#v}"
          server="$(node -p 'require("./packages/server/package.json").version')"
          if [ "$server" != "$version" ]; then echo "packages/server is $server, the tag is $TAG"; exit 1; fi
          latest=false
          case "$version" in
            *-*) ;;
            *)
              highest="$(gh api "repos/$GH_REPO/git/matching-refs/tags/v" --paginate --jq '.[].ref' \
                | sed -n 's#^refs/tags/v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$#\1#p' \
                | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)"
              if [ -z "$highest" ]; then echo "could not list the release tags"; exit 1; fi
              if [ "$highest" = "$version" ]; then latest=true; fi
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "$TAG builds ghcr.io/runlightsh/runlight:$version (latest: $latest)"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/runlightsh/runlight
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.title=Runlight
            org.opencontainers.image.description=Privacy friendly web analytics for any number of sites.
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ needs.ci.outputs.sha }}
      # Nothing is pushed until the image runs: the amd64 build, loaded into
      # the runner's Docker, must start and answer /healthz. The push below
      # reuses this build's layers.
      - name: Build the amd64 image to try
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: runlight:smoke
      - name: Start it and ask /healthz
        run: |
          docker run -d --name smoke -p 127.0.0.1:3000:3000 runlight:smoke
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz; then echo; docker rm -f smoke; exit 0; fi
            sleep 2
          done
          echo "the image did not answer /healthz in a minute"
          docker logs smoke
          exit 1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

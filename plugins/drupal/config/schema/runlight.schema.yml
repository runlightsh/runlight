runlight.settings:
  type: config_object
  label: 'Runlight settings'
  mapping:
    mode:
      type: string
      label: 'Where Runlight runs'
    address:
      type: string
      label: 'Runlight address'
    site:
      type: string
      label: 'Site id'
    observe_key:
      type: string
      label: 'Agents key'
    dashboard_key:
      type: string
      label: 'Dashboard key'
    skip_admins:
      type: boolean
      label: 'Leave out administrators'
    outbound:
      type: boolean
      label: 'Count outbound links'
    downloads:
      type: boolean
      label: 'Count file downloads'
    locations:
      type: boolean
      label: 'Show countries'

runlight.settings:
  path: '/admin/config/system/runlight'
  defaults:
    _form: '\Drupal\runlight\Form\SettingsForm'
    _title: 'Runlight'
  requirements:
    _permission: 'administer runlight'

runlight.check:
  path: '/admin/config/system/runlight/check'
  defaults:
    _controller: '\Drupal\runlight\Controller\DashboardController::check'
  methods: [POST]
  requirements:
    _permission: 'administer runlight'
    _csrf_token: 'TRUE'

runlight.dashboard:
  path: '/admin/reports/runlight'
  defaults:
    _controller: '\Drupal\runlight\Controller\DashboardController::open'
    _title: 'Runlight'
  requirements:
    _permission: 'administer runlight+view runlight'

# Where the Runlight sends the admin back to after Connect. The state kept for
# the admin who started it does a CSRF token's work, so there is none here.
runlight.connected:
  path: '/admin/config/system/runlight/connected'
  defaults:
    _controller: '\Drupal\runlight\Controller\ConnectController::finish'
  requirements:
    _permission: 'administer runlight'
  options:
    no_cache: 'TRUE'

# Runlight running in this Drupal: everything under /runlight comes here, by
# way of the path processor, and only answers while Runlight runs here.
# Runlight checks who may read its numbers itself, from the signed-in user.
runlight.local:
  path: '/runlight'
  defaults:
    _controller: '\Drupal\runlight\Controller\LocalController::serve'
  # Drupal allows only GET and POST on a route that names none, and the
  # dashboard also changes things with PATCH and DELETE.
  methods: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]
  requirements:
    # Open: every visitor's page posts its visit here, and Runlight asks for
    # Administer Runlight or View Runlight before showing or changing anything.
    _access: 'TRUE'
  options:
    no_cache: 'TRUE'

runlight.link:
  path: '/go/{slug}'
  defaults:
    _controller: '\Drupal\runlight\Controller\LocalController::link'
  requirements:
    # Open: a short link is for anyone who follows it.
    _access: 'TRUE'
  options:
    no_cache: 'TRUE'

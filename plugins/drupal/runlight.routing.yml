runlight.settings:
  path: '/admin/config/system/runlight'
  defaults:
    _form: '\Drupal\runlight\Form\SettingsForm'
    _title: 'Runlight'
  requirements:
    _permission: 'administer runlight'

runlight.check:
  path: '/admin/config/system/runlight/check'
  defaults:
    _controller: '\Drupal\runlight\Controller\DashboardController::check'
  methods: [POST]
  requirements:
    _permission: 'administer runlight'
    _csrf_token: 'TRUE'

runlight.dashboard:
  path: '/admin/reports/runlight'
  defaults:
    _controller: '\Drupal\runlight\Controller\DashboardController::open'
    _title: 'Runlight'
  requirements:
    _permission: 'administer runlight'
